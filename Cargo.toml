[package]
name = "tuikanban"
version = "0.1.0"
edition = "2021"
description = "A local-first terminal kanban board and scriptable CLI"
license = "MIT"

[[bin]]
name = "kanban"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
crossterm = "0.28"
fs2 = "0.4"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shlex = "2"
tempfile = "3"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
